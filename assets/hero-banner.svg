<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="260">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <!-- Neon Accent Gradients -->
    <linearGradient id="neon-primary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7">
        <animate attributeName="stop-color" values="#7aa2f7; #7dcfff; #bb9af7; #7aa2f7" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#bb9af7">
        <animate attributeName="stop-color" values="#bb9af7; #7aa2f7; #7dcfff; #bb9af7" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#7dcfff">
        <animate attributeName="stop-color" values="#7dcfff; #bb9af7; #7aa2f7; #7dcfff" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="cyber-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ac3de" />
      <stop offset="100%" stop-color="#7dcfff" />
    </linearGradient>

    <linearGradient id="glow-badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#bb9af7" stop-opacity="0.2" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#7aa2f7" stroke-width="0.5" stroke-opacity="0.08" />
    </pattern>

    <!-- Glow Filters -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, Helvetica, Arial, sans-serif; }
    
    .title-text {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 2.5px;
      fill: url(#neon-primary);
      filter: drop-shadow(0 0 12px rgba(122, 162, 247, 0.45));
    }
    
    .tagline {
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: 2px;
      fill: #7dcfff;
      text-transform: uppercase;
    }

    .status-text {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      fill: #73daca;
    }

    .pill-text {
      font-size: 11px;
      font-weight: 500;
      fill: #c0caf5;
      letter-spacing: 0.5px;
    }

    .border-glow {
      stroke: #7aa2f7;
      stroke-opacity: 0.35;
      stroke-width: 1.2;
    }

    @keyframes pulse {
      0% { opacity: 0.3; }
      50% { opacity: 0.9; }
      100% { opacity: 0.3; }
    }

    .pulsing-dot {
      animation: pulse 2s infinite ease-in-out;
    }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="846" height="256" rx="14" fill="url(#bg-grad)" stroke="#30363d" stroke-width="1.5" />
  
  <!-- Grid overlay -->
  <rect x="2" y="2" width="846" height="256" rx="14" fill="url(#cyber-grid)" />

  <!-- Outer Neon Border Accent on Top -->
  <path d="M 16 2 L 834 2" stroke="url(#neon-primary)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Top Status Bar -->
  <g transform="translate(30, 36)">
    <!-- Terminal Dots -->
    <circle cx="0" cy="0" r="5" fill="#f7768e" />
    <circle cx="16" cy="0" r="5" fill="#e0af68" />
    <circle cx="32" cy="0" r="5" fill="#9ece6a" />

    <!-- System Status Pill -->
    <rect x="58" y="-11" width="220" height="22" rx="11" fill="#161b22" stroke="#2ac3de" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="72" cy="0" r="3.5" fill="#73daca" class="pulsing-dot" />
    <text x="83" y="4" class="font-mono status-text">SYSTEM ONLINE // DUAL-THREAT</text>

    <!-- Right Side Coordinates / Version -->
    <text x="790" y="4" text-anchor="end" class="font-mono" font-size="11" fill="#565f89">HEX://0x7AA2F7 • v2.6.4</text>
  </g>

  <!-- Main Hero Content -->
  <g transform="translate(40, 98)">
    <!-- Subtitle / Eyebrow -->
    <text x="0" y="0" class="font-mono tagline">FULL-STACK ARCHITECT × DEEP-TECH RESEARCHER</text>
    
    <!-- Hero Name -->
    <text x="0" y="42" class="font-sans title-text">BHUMIT GUPTA</text>

    <!-- Bio Summary -->
    <text x="0" y="70" class="font-sans" font-size="13" fill="#a9b1d6" font-weight="400">
      Scaling bleeding-edge AI &amp; Quantum ML from research bench to enterprise-grade web architectures.
    </text>
  </g>

  <!-- Feature Highlights / Badges Bar -->
  <g transform="translate(40, 202)">
    <!-- Pill 1: 6+ Papers -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="168" height="28" rx="6" fill="#161b22" stroke="#7aa2f7" stroke-opacity="0.3" stroke-width="1" />
      <text x="12" y="18" font-size="12">📚</text>
      <text x="32" y="18" class="font-mono pill-text"><tspan fill="#7aa2f7" font-weight="bold">6+</tspan> IEEE/Journals</text>
    </g>

    <!-- Pill 2: Patent-Pending -->
    <g transform="translate(180, 0)">
      <rect x="0" y="0" width="195" height="28" rx="6" fill="#161b22" stroke="#bb9af7" stroke-opacity="0.3" stroke-width="1" />
      <text x="12" y="18" font-size="12">⚡</text>
      <text x="32" y="18" class="font-mono pill-text"><tspan fill="#bb9af7" font-weight="bold">MAW-Gen</tspan> Patent-Pending</text>
    </g>

    <!-- Pill 3: Quantum ML -->
    <g transform="translate(387, 0)">
      <rect x="0" y="0" width="175" height="28" rx="6" fill="#161b22" stroke="#7dcfff" stroke-opacity="0.3" stroke-width="1" />
      <text x="12" y="18" font-size="12">🔬</text>
      <text x="32" y="18" class="font-mono pill-text"><tspan fill="#7dcfff" font-weight="bold">Quantum ML</tspan> PennyLane</text>
    </g>

    <!-- Pill 4: LeetCode 200+ -->
    <g transform="translate(574, 0)">
      <rect x="0" y="0" width="196" height="28" rx="6" fill="#161b22" stroke="#2ac3de" stroke-opacity="0.3" stroke-width="1" />
      <text x="12" y="18" font-size="12">🧠</text>
      <text x="32" y="18" class="font-mono pill-text"><tspan fill="#2ac3de" font-weight="bold">200+</tspan> LeetCode Solved</text>
    </g>
  </g>

  <!-- Cyberpunk Corner Accents -->
  <path d="M 810 240 L 836 240 L 836 214" fill="none" stroke="#7aa2f7" stroke-width="2" stroke-opacity="0.5" />
  <path d="M 830 246 L 842 246" stroke="#bb9af7" stroke-width="1.5" />
</svg>