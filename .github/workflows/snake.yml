name: Generate Contribution Snake Animation

on:
  schedule: # Run automatically every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch: # Allows manual trigger anytime
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: bhumitg07205
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#7dcfff&color_dots=#161b22,#1f2937,#2ac3de,#7aa2f7,#bb9af7
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#7dcfff&color_dots=#161b22,#1f2937,#2ac3de,#7aa2f7,#bb9af7

      - name: Push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
